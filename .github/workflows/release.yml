name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle + NDK + build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
            android/.gradle
            android/app/build/intermediates
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm deps
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm install --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64 + armeabi only — skip emulator archs)
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -x lint \
            -x lintVitalRelease \
            -x lintVitalAnalyzeRelease \
            --no-daemon

      - name: Compute release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Rename APK + create stable alias
        run: |
          cd android/app/build/outputs/apk/release
          mv app-release.apk HDGEcalls-${{ steps.tag.outputs.tag }}.apk
          cp HDGEcalls-${{ steps.tag.outputs.tag }}.apk HDGEcalls-latest.apk

      - name: Create / update Release on the PUBLIC releases-only repo
        uses: softprops/action-gh-release@v2
        with:
          # Source code stays in the private HDGEcalls-App repo. Built APKs
          # land in this public repo so anonymous testers can download them
          # without a login wall. The token below must have write access to
          # `repository`.
          repository: devdattatalele/HDGEcalls-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: HDGEcalls ${{ steps.tag.outputs.tag }}
          body: |
            Automated build from `devdattatalele/HDGEcalls-App@${{ github.sha }}`.

            Install: download `HDGEcalls-latest.apk` and sideload.
          files: |
            android/app/build/outputs/apk/release/HDGEcalls-${{ steps.tag.outputs.tag }}.apk
            android/app/build/outputs/apk/release/HDGEcalls-latest.apk
